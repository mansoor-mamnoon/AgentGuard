# LLMFirewall default policy — safe enterprise assistant
# Each tool entry specifies:
#   effect: read_private | write_external | write_internal | read_sensitive
#   allowed_sources: list of taint labels that may authorize this tool
#   forbidden_inputs: list of taint labels that are forbidden in tool args
#   allowed_intents: (optional) list of user intent labels that may call this tool

tools:
  search_docs:
    effect: read_private
    allowed_sources:
      - SYSTEM_TRUSTED
      - USER_UNTRUSTED
    allowed_intents:
      - search
      - summarize
      - email
      - unknown

  read_email:
    effect: read_private
    allowed_sources:
      - SYSTEM_TRUSTED
      - USER_UNTRUSTED
    allowed_intents:
      - email
      - summarize

  send_email:
    effect: write_external
    allowed_sources:
      - SYSTEM_TRUSTED
    forbidden_inputs:
      - RAG_UNTRUSTED
      - TOOL_OUTPUT
      - SECRET
    requires:
      - explicit_user_authorization
      - trusted_control_source

  post_slack:
    effect: write_external
    allowed_sources:
      - SYSTEM_TRUSTED
    forbidden_inputs:
      - RAG_UNTRUSTED
      - TOOL_OUTPUT
      - SECRET
    requires:
      - explicit_user_authorization
      - trusted_control_source

  read_calendar:
    effect: read_private
    allowed_sources:
      - SYSTEM_TRUSTED
      - USER_UNTRUSTED
    allowed_intents:
      - calendar
      - summarize

  create_calendar_event:
    effect: write_internal
    allowed_sources:
      - SYSTEM_TRUSTED
      - USER_UNTRUSTED
    forbidden_inputs:
      - RAG_UNTRUSTED
      - TOOL_OUTPUT

  read_secret:
    effect: read_sensitive
    allowed_sources:
      - SYSTEM_TRUSTED
    forbidden_inputs:
      - RAG_UNTRUSTED
      - TOOL_OUTPUT
      - USER_UNTRUSTED

  transfer_money:
    effect: write_external
    allowed_sources:
      - SYSTEM_TRUSTED
    forbidden_inputs:
      - RAG_UNTRUSTED
      - TOOL_OUTPUT
      - USER_UNTRUSTED
    requires:
      - explicit_user_authorization
      - explicit_recipient_confirmation
      - trusted_control_source

global_rules:
  max_arg_length: 500
  allowed_external_domains: []
  block_on_external_url_in_args: true
  fpr_budget: 0.10
