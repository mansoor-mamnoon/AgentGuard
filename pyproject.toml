[project]
name = "prompt-injection-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "hypothesis>=6.152.7",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "runtime_guard/tests", "eval/tests", "attackgen/tests"]
pythonpath = ["."]
